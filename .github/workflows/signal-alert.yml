# Starts a ~6-hour monitoring job every 6 hours (and on manual "Run workflow").
# Secret needed (Settings -> Secrets and variables -> Actions): TELEGRAM_TOKEN
name: signal-alert
on:
  schedule:
    - cron: "0 */6 * * *"   # start a 6-hour monitoring job every 6 hours
  workflow_dispatch:         # allows a manual start from the Actions tab
    inputs:
      duration:
        description: "Seconds to keep running"
        default: "21000"
concurrency:
  group: signal-alert
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write   # the daily record is committed to records/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests numpy
      - run: python -u alert/signal_alert.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: "8623876357"
          EQUITY: "100"
          RISK_LONG: "0.06"
          RISK_SHORT: "0.01"
          RISK_C: "0.06"
          RISK_D: "0.06"
          CAP_D: "0.01"
          DURATION: ${{ inputs.duration || '21000' }}
          HEARTBEAT: "1"
